<svg xmlns="http://www.w3.org/2000/svg" width="440" height="456" viewBox="0 0 440 456" role="img" aria-labelledby="title desc">
<title id="title">SecondOut — NO DEVICE</title><desc id="desc">SecondOut plugin interface in the NO DEVICE state.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101318"/><stop offset="1" stop-color="#0C0F13"/></linearGradient>
 <linearGradient id="card" x2="0" y2="1"><stop stop-color="#1A1F26"/><stop offset="1" stop-color="#151A20"/></linearGradient>
 <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
 <style>
  text{font-family:'Segoe UI',sans-serif;fill:#F4F7FA}.brand{font-size:9px;font-weight:700;letter-spacing:1.35px;fill:#9AA5B3}.product{font-size:13px;font-weight:650}.version{font-size:8px;fill:#697481}.label{font-size:8px;font-weight:700;letter-spacing:1.05px;fill:#8E99A7}.device{font-size:10px;font-weight:500}.button{font-size:8px;font-weight:700;letter-spacing:.45px}.state{font-size:21px;font-weight:750;letter-spacing:.4px}.subtitle{font-size:10px;fill:#C5CDD7}.hint{font-size:8.5px;fill:#8E99A7}.tag{font-size:7px;font-weight:750;letter-spacing:1.1px}.metric{font-size:14px;font-weight:700}.metriclabel{font-size:7px;fill:#737F8E}.micro{font-size:7px;fill:#737F8E}.footer{font-size:7px;fill:#56616E;letter-spacing:.15px}
 </style>
</defs>
<rect width="440" height="456" rx="0" fill="url(#bg)"/>
<rect x=".5" y=".5" width="439" height="455" fill="none" stroke="#35404B"/>
<!-- header -->
<g transform="translate(16 17)"><text x="0" y="14" class="product">SecondOut</text><text x="76" y="14" class="brand">SECOND OUTPUT MONITOR</text><text x="408" y="14" text-anchor="end" class="version">v0.2.0</text></g>
<path d="M16 52H424" stroke="#252C34"/>
<!-- selector -->
<text x="16" y="76" class="label">OUTPUT DEVICE</text><text x="424" y="76" text-anchor="end" class="label">OUTPUT</text>
<g transform="translate(16 86)"><rect width="270" height="38" rx="9" fill="#171B21" stroke="#303844"/><path d="M12 17h4l5-4v12l-5-4h-4z" fill="#8995A4"/><path d="M24 16c2 2 2 6 0 8" fill="none" stroke="#8995A4" stroke-linecap="round"/><text x="39" y="24" class="device">Choose output device…</text><path d="M250 16l5 5 5-5" fill="none" stroke="#8995A4" stroke-width="1.5"/></g>
<g transform="translate(294 86)"><rect width="65" height="38" rx="9" fill="#171B21" stroke="#303844"/><path d="M17 14a6 6 0 1 0 5-2" fill="none" stroke="#8995A4" stroke-width="1.5"/><path d="M21 9l2 4-4 1" fill="none" stroke="#8995A4" stroke-width="1.5"/><text x="44" y="23" text-anchor="middle" class="button">RESCAN</text></g>
<g transform="translate(371 91)"><rect width="53" height="28" rx="14" fill="#2A3038"/><circle cx="14" cy="14" r="10" fill="#F7FAFC"/><text x="26.5" y="43" text-anchor="middle" class="tag" fill="#7F8A97">OFF</text></g>
<!-- hero -->
<g transform="translate(16 142)"><rect width="408" height="96" rx="11" fill="url(#card)" stroke="#303843"/><rect width="4" height="96" rx="2" fill="#84909F"/>
<circle cx="22" cy="31" r="14" fill="rgba(132,144,159,.10)"/><circle cx="22" cy="31" r="9" fill="#84909F" opacity=".25" filter="url(#glow)"/><circle cx="22" cy="31" r="6" fill="#84909F"/>
<text x="46" y="36" class="state" fill="#84909F">NO DEVICE</text><text x="46" y="55" class="subtitle">Choose an output device to begin</text>
<g transform="translate(314 14)"><rect width="78" height="20" rx="6" fill="rgba(132,144,159,.09)" stroke="rgba(132,144,159,.30)"/><text x="39" y="13.5" text-anchor="middle" class="tag" fill="#84909F">SETUP REQUIRED</text></g>
<text x="31" y="79" class="hint">Select a device above</text>
</g>
<!-- health -->
<g transform="translate(16 250)"><rect width="408" height="74" rx="11" fill="#151A20" stroke="#2D3540"/><text x="13" y="20" class="label">BUFFER HEALTH</text><text x="395" y="20" text-anchor="end" class="micro">TARGET 50%</text>
<rect x="13" y="34" width="382" height="12" rx="6" fill="#242A31"/><rect x="13" y="34" width="0" height="12" rx="6" fill="#2B3038"/><rect x="203" y="31" width="2" height="18" rx="1" fill="#F4F7FA" opacity=".85"/><text x="13" y="60" class="micro">0%</text><text x="204" y="60" text-anchor="middle" class="micro">50%</text><text x="395" y="60" text-anchor="end" class="micro">100%</text></g>
<!-- diagnostics -->
<g transform="translate(16 336)"><rect width="408" height="72" rx="11" fill="#151A20" stroke="#2D3540"/><path d="M136 14v44M272 14v44" stroke="#29313A"/><text x="13" y="22" class="metriclabel">BUFFER</text><text x="13" y="45" class="metric">0%</text><text x="149" y="22" class="metriclabel">DRIFT TRIM</text><text x="149" y="45" class="metric">—</text><text x="285" y="22" class="metriclabel">UNDERRUNS</text><text x="285" y="45" class="metric" fill="#F4F7FA">0</text><text x="390" y="45" text-anchor="end" class="button" fill="#9AA5B3">DETAILS⌄</text></g>
<text x="220" y="438" text-anchor="middle" class="footer">SecondOut mirrors your audio to a second output.</text>
</svg>