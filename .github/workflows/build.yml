name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Pushing three commits in a row used to leave three full builds running at
# once. Only the newest ref matters, so supersede the older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (signed + notarised VST3 / AU / Standalone)
    # macOS runners cost roughly 6x Windows and 10x Linux per minute, and on a
    # private repo that comes out of a monthly allowance. Building a notarised
    # Mac package on every commit burns it for nothing - notarisation only
    # matters for something you actually ship. Releases (tags) and on-demand
    # runs only; Windows still checks every push, at a tenth of the price.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: macos-14
    env:
      # Developer ID Application - signs the .vst3 / .component / .app bundles.
      DEV_ID_APP_P12:            ${{ secrets.MAC_CERT_P12 }}
      DEV_ID_APP_P12_PASSWORD:   ${{ secrets.MAC_CERT_PASSWORD }}
      # Developer ID Installer - a DIFFERENT certificate, signs the .pkg.
      DEV_ID_INST_P12:           ${{ secrets.MAC_INSTALLER_P12 }}
      DEV_ID_INST_P12_PASSWORD:  ${{ secrets.MAC_INSTALLER_PASSWORD }}
      APPLE_TEAM_ID:             ${{ secrets.APPLE_TEAM_ID }}
      # App Store Connect API key, used by notarytool. Preferred over an Apple
      # ID + app-specific password: it doesn't break when the account password
      # changes, and it is what this org has.
      ASC_KEY_P8:                ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID:                ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:             ${{ secrets.ASC_ISSUER_ID }}
      # NB: the org also holds APPLE_DIST_P12 and MAS_INSTALLER_P12. Those are
      # the Mac App Store pair and are deliberately NOT imported - direct
      # distribution needs the Developer ID certificates, and a second
      # "Apple Distribution" identity in the keychain would make codesign's
      # identity matching ambiguous.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A missing secret must not quietly produce an unsigned build that looks
      # like a release. A tag is a release and hard-fails; anything else warns
      # loudly and labels the artefact UNSIGNED so it can't be mistaken for one.
      - name: Require signing material
        id: gate
        run: |
          missing=()
          [ -n "$DEV_ID_APP_P12" ]           || missing+=(MAC_CERT_P12)
          [ -n "$DEV_ID_APP_P12_PASSWORD" ]  || missing+=(MAC_CERT_PASSWORD)
          [ -n "$DEV_ID_INST_P12" ]          || missing+=(MAC_INSTALLER_P12)
          [ -n "$DEV_ID_INST_P12_PASSWORD" ] || missing+=(MAC_INSTALLER_PASSWORD)
          [ -n "$APPLE_TEAM_ID" ]            || missing+=(APPLE_TEAM_ID)
          [ -n "$ASC_KEY_P8" ]               || missing+=(ASC_KEY_P8)
          [ -n "$ASC_KEY_ID" ]               || missing+=(ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ]            || missing+=(ASC_ISSUER_ID)

          if [ ${#missing[@]} -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarisation enabled."
            exit 0
          fi

          echo "sign=false" >> "$GITHUB_OUTPUT"
          printf 'Missing secret: %s\n' "${missing[@]}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Unsigned build - GitHub never exposes secrets to pull requests."
            exit 0
          fi

          # Almost always the same cause: these are ORGANISATION secrets whose
          # visibility is "Private repositories", and this repository is public,
          # so GitHub hands the job empty strings. Fix by making the repo
          # private, or by setting each secret's visibility to include it.
          echo "::warning::Unsigned macOS build - the secrets above resolved empty. If they exist in the org, check their visibility covers THIS repository (public repos are excluded by the 'Private repositories' setting)."

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::Refusing to publish an unsigned build for tag ${{ github.ref_name }}."
            exit 1
          fi

      - name: Import signing certificates
        if: steps.gate.outputs.sign == 'true'
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Keep the login keychain in the search list so Apple's intermediate
          # certificates stay reachable while ours is the default.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          # Decode a base64-encoded .p12 secret, and say exactly what is wrong
          # when it isn't one. Only the shape is ever reported - length and
          # whether it looks like PEM - never any of the value itself.
          decode_p12 () {
            raw="$1"; out="$2"; name="$3"
            stripped=$(printf '%s' "$raw" | tr -d '[:space:]')

            if [ -z "$stripped" ]; then
              echo "::error::$name is empty."
              return 1
            fi

            case "$stripped" in
              -----BEGIN*)
                echo "::error::$name holds PEM text (it starts with -----BEGIN), but a base64-encoded .p12 is required. Regenerate it with:  base64 -i developerID_xxx.p12 | pbcopy"
                return 1 ;;
            esac

            if ! printf '%s' "$stripped" | base64 --decode > "$out" 2>/dev/null || [ ! -s "$out" ]; then
              echo "::error::$name is not valid base64 (${#stripped} characters after whitespace was stripped). It should be the output of:  base64 -i developerID_xxx.p12"
              return 1
            fi

            # PKCS#12 is DER, so byte one is always an ASN.1 SEQUENCE tag (0x30).
            # Catches a .cer/.pem that happened to base64-decode into something.
            if [ "$(head -c 1 "$out" | xxd -p)" != "30" ]; then
              echo "::error::$name decoded, but the result is not a PKCS#12 archive. It is probably a .cer or .pem - those hold only the certificate, with no private key, and cannot sign."
              return 1
            fi

            echo "  $name: decoded OK ($(wc -c < "$out" | tr -d ' ') bytes)"
          }

          echo "Checking certificate secrets:"
          decode_p12 "$DEV_ID_APP_P12"  app.p12       MAC_CERT_P12
          decode_p12 "$DEV_ID_INST_P12" installer.p12 MAC_INSTALLER_P12

          security import app.p12       -k "$KEYCHAIN" -P "$DEV_ID_APP_P12_PASSWORD"  -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k "$KEYCHAIN" -P "$DEV_ID_INST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f app.p12 installer.p12

          # Without this, codesign blocks on a GUI prompt and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          echo "Identities available to this build:"
          security find-identity -v | sed 's/^/  /'

      - name: Configure
        run: |
          if [ "${{ steps.gate.outputs.sign }}" = "true" ]; then
            # Let Xcode sign at build time: JUCE has already generated the
            # hardened-runtime entitlements (including audio-input), and Xcode
            # applies them. Signing the bundles by hand afterwards would mean
            # reproducing that entitlements wiring correctly.
            cmake -S . -B build -G Xcode \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="Developer ID Application" \
              -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              -DCMAKE_XCODE_ATTRIBUTE_OTHER_CODE_SIGN_FLAGS="--timestamp"
          else
            cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          fi

      - name: Build
        run: cmake --build build --config Release --target SecondOut_VST3 SecondOut_AU SecondOut_Standalone SecondOutTests

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^project(SecondOut VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      # Trust but verify: a build can succeed with signing silently skipped.
      - name: Verify bundle signatures
        if: steps.gate.outputs.sign == 'true'
        run: |
          ART=build/SecondOut_artefacts/Release
          for bundle in "$ART/VST3/SecondOut.vst3" "$ART/AU/SecondOut.component" "$ART/Standalone/SecondOut.app"; do
            echo "== $bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            codesign --display --verbose=2 --entitlements - "$bundle" 2>&1 | sed 's/^/  /'
            codesign --display --verbose=2 "$bundle" 2>&1 | grep -q "flags=.*runtime" \
              || { echo "::error::$bundle is not signed with the hardened runtime - notarisation would reject it."; exit 1; }
          done

      - name: Assemble installer package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ART=build/SecondOut_artefacts/Release
          ROOT=pkgroot

          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Applications"
          cp -R "$ART/VST3/SecondOut.vst3"      "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$ART/AU/SecondOut.component"   "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$ART/Standalone/SecondOut.app" "$ROOT/Applications/"

          pkgbuild --root "$ROOT" \
                   --identifier com.amanorsacstudio.secondout.installer \
                   --version "$VERSION" \
                   --install-location / \
                   "SecondOut-$VERSION-unsigned.pkg"

      - name: Sign, notarise and staple the installer
        if: steps.gate.outputs.sign == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="SecondOut-$VERSION-macOS.pkg"

          productsign --sign "Developer ID Installer" "SecondOut-$VERSION-unsigned.pkg" "$PKG"
          rm -f "SecondOut-$VERSION-unsigned.pkg"
          pkgutil --check-signature "$PKG"

          # The .p8 may have been stored either base64-encoded or as the raw
          # PEM text; accept both rather than burning a run guessing.
          printf '%s' "$ASC_KEY_P8" | base64 --decode > asc.p8 2>/dev/null || true
          if ! grep -q "BEGIN PRIVATE KEY" asc.p8 2>/dev/null; then
            printf '%s' "$ASC_KEY_P8" > asc.p8
          fi
          grep -q "BEGIN PRIVATE KEY" asc.p8 \
            || { echo "::error::ASC_KEY_P8 is neither base64-encoded nor a raw .p8 private key."; rm -f asc.p8; exit 1; }

          trap 'rm -f asc.p8' EXIT
          xcrun notarytool submit "$PKG" --key asc.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m

          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          # What a customer's Mac will actually decide when they open it.
          spctl --assess -vv --type install "$PKG"

      - name: Name the unsigned package honestly
        if: steps.gate.outputs.sign != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv "SecondOut-$VERSION-unsigned.pkg" "SecondOut-$VERSION-macOS-UNSIGNED.pkg"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SecondOut-${{ steps.version.outputs.version }}-macOS
          path: SecondOut-*.pkg
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && steps.gate.outputs.sign == 'true'
        run: security delete-keychain build.keychain || true

  windows:
    # Regression check that the shared CMake/source still builds on Windows.
    # No ASIO SDK on the runner, so this is a WASAPI-only build - the shipped
    # Windows installer is built locally with the SDK present.
    name: Windows (WASAPI-only build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # No explicit generator: the runner image's Visual Studio version
        # changes over time, and CMake defaults to the newest one installed.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target SecondOut_VST3 SecondOut_Standalone SecondOutTests

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
